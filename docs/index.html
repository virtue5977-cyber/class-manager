<h1>담임업무</h1>
<p>담임 교사가 출결, 결석신고서, 상담일지, 학급 명렬표·자리배치·청소배치, 학사일정을 한곳에서 관리하는 개인용 프로그램입니다. 모든 학생 자료는 교사 본인의 컴퓨터에만 저장됩니다.</p>
<h2>구글 캘린더 연동</h2>
<p>사용자가 직접 "구글로 로그인"을 누른 경우에만, 학사일정을 사용자 구글 계정의 "학사일정(담임업무)" 캘린더에 넣고 사용자의 기본 캘린더 일정을 읽어 프로그램 달력에 보여 줍니다.</p>
